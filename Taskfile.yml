version: '3'

tasks:
  default:
    deps: [test, build-wasm]
  list:
    cmds: [task --list-all]

  go-tidy:
    run: once
    cmds: [go mod tidy]

  test:
    desc: 'Host-platform tests (stubs, helpers)'
    cmds: [go test ./...]

  build-wasm:
    desc: 'Compile every package under GOOS=js GOARCH=wasm — guards against build regressions'
    cmds:
      - GOOS=js GOARCH=wasm go build ./...

  build-tool:
    desc: 'Build the asset tool binary'
    cmds:
      - go build -o bin/ntshim-assets ./cmd/ntshim-assets

  examples:
    desc: 'Build wasm for every example'
    cmds:
      - task: examples-duckdb-sql
      - task: examples-duckdb-arrow
      - task: examples-pdfium-render
      - task: examples-flintchart-compile
      - task: examples-audio

  examples-duckdb-sql:
    dir: examples/duckdb-sql
    cmds:
      - GOOS=js GOARCH=wasm go build -o app.wasm .
      - go tool ntshim-assets . --shim=duckdb

  examples-duckdb-arrow:
    dir: examples/duckdb-arrow
    cmds:
      - GOOS=js GOARCH=wasm go build -o app.wasm .
      - go tool ntshim-assets . --shim=duckdb

  examples-pdfium-render:
    dir: examples/pdfium-render
    cmds:
      - GOOS=js GOARCH=wasm go build -o app.wasm .
      - go tool ntshim-assets . --shim=pdfium

  examples-flintchart-compile:
    dir: examples/flintchart-compile
    cmds:
      - GOOS=js GOARCH=wasm go build -o app.wasm .
      - go tool ntshim-assets . --shim=flintchart

  examples-audio:
    dir: examples/audio
    cmds:
      - GOOS=js GOARCH=wasm go build -o app.wasm .
      - go tool ntshim-assets . --shim=audio
