name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Host-platform tests
        run: go test ./...
      - name: GOOS=js GOARCH=wasm build
        run: GOOS=js GOARCH=wasm go build ./...
      - name: Examples build
        run: |
          cd examples/duckdb-sql   && GOOS=js GOARCH=wasm go build -o app.wasm .
          cd ../duckdb-arrow       && GOOS=js GOARCH=wasm go build -o app.wasm .
          cd ../pdfium-render      && GOOS=js GOARCH=wasm go build -o app.wasm .
          cd ../flintchart-compile && GOOS=js GOARCH=wasm go build -o app.wasm .
          cd ../audio              && GOOS=js GOARCH=wasm go build -o app.wasm .
      - name: Installed flintchart bridge smoke test
        run: |
          go tool ntshim-assets examples/flintchart-compile --shim=flintchart
          node examples/flintchart-compile/smoke.mjs
      - name: DuckDB and Haybarn bridge tests
        run: node --test web/duckdb/bridge.test.mjs
